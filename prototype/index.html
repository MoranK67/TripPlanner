<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מתכנן הטיולים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF8F4;
    --panel:#FFFFFF;
    --ink:#4A4458;
    --muted:#9A93A6;
    --line:#F0EBF2;
    --line-strong:#E4DCE8;
    --accent:#CFC3F3;
    --accent-strong:#B3A3EA;
    --accent-ink:#4E3F8A;
    --accent-soft:#F3EFFC;
    --danger:#F6C1CA;
    --danger-ink:#9A3B50;
    --ok:#9ED8B4;
    --H:28px;
  }
  [hidden]{display:none !important}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  }
  body.is-dragging, body.is-dragging *{cursor:grabbing !important;user-select:none}
  button,input,select{font:inherit;color:inherit}

  /* ---------- Header ---------- */
  .top{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
  .logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#FFD6E0,#DAD4FA);display:grid;place-items:center}
  .brand h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.2px}
  .trip-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .trip-sel{
    padding:8px 12px;border-radius:12px;border:1px solid var(--line-strong);background:var(--bg);
    font-weight:500;min-width:160px;max-width:240px;
  }
  .range{font-size:13px;color:var(--muted);padding-inline:4px}

  .btn{
    border:0;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500;font-size:14px;
    background:var(--accent-soft);color:var(--accent-ink);transition:background .15s, transform .1s;
    white-space:nowrap;
  }
  .btn:hover{background:#E9E2FB}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{background:var(--accent-strong)}
  .btn.ghost{background:transparent;color:var(--muted)}
  .btn.ghost:hover{background:var(--line)}
  .btn.danger{background:var(--danger);color:var(--danger-ink)}
  .btn.danger:hover{background:#F2AEBA}
  .btn.small{padding:6px 12px;font-size:13px}

  /* ---------- Layout ---------- */
  #main{
    flex:1;min-height:0;display:grid;grid-template-columns:270px 1fr;gap:16px;padding:16px 20px;
  }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 1px 3px rgba(90,70,110,.04)}

  /* ---------- Bank ---------- */
  .bank{display:flex;flex-direction:column;min-height:0;transition:background .15s}
  .bank-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  .bank-head h2{font-size:16px;margin:0;font-weight:600}
  .bank-head .count{font-size:12px;color:var(--muted);font-weight:400;margin-inline-start:6px}
  .bank-list{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .bank.drop-hover{background:var(--accent-soft);outline:2px dashed var(--accent-strong);outline-offset:-6px}
  .bank-empty{color:var(--muted);font-size:13.5px;text-align:center;padding:24px 8px;line-height:1.6}
  .hint{font-size:12px;color:var(--muted);padding:8px 16px 12px;line-height:1.5;border-top:1px solid var(--line)}

  /* ---------- Board / grid ---------- */
  .board{min-width:0;min-height:0;overflow:hidden;display:flex}
  .grid-scroll{flex:1;overflow:auto;border-radius:20px}
  .grid{display:grid;width:max-content;min-width:100%}
  .corner,.day-head{
    position:sticky;top:0;z-index:3;background:var(--panel);
    border-bottom:1px solid var(--line-strong);height:56px;
  }
  .corner{inset-inline-start:0;z-index:5}
  .day-head{text-align:center;padding:9px 6px;border-inline-start:1px solid var(--line)}
  .day-head .dn{font-weight:600;font-size:14px}
  .day-head .dd{font-size:12px;color:var(--muted);margin-top:2px}
  .times{position:sticky;inset-inline-start:0;z-index:2;background:var(--panel)}
  .times .t{height:var(--H);font-size:11px;color:var(--muted);text-align:center;padding-top:3px}
  .day-col{position:relative;border-inline-start:1px solid var(--line)}
  .slot{height:var(--H);border-bottom:1px dashed var(--line)}
  .slot.odd{border-bottom:1px solid var(--line-strong)}
  .slot.off{background:repeating-linear-gradient(45deg,#F6F3F7 0 6px,#FBFAFB 6px 12px)}

  /* ---------- Blocks ---------- */
  .block{
    position:relative;flex-shrink:0;
    background:var(--c);color:#40394F;
    border:1px solid color-mix(in srgb, var(--c), #5A4A6A 16%);
    border-radius:10px;padding:6px 10px;padding-inline-end:28px;
    box-shadow:0 1px 2px rgba(80,60,100,.07);
    cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;
    transition:box-shadow .15s, opacity .15s;
  }
  .block:hover{box-shadow:0 3px 10px rgba(80,60,100,.12)}
  .day-col .block{position:absolute;inset-inline:4px;z-index:2}
  .block .bn{font-weight:600;font-size:13px;line-height:1.3;word-break:break-word}
  .block .bt{font-size:11.5px;opacity:.72;margin-top:1px}
  .block.short{display:flex;align-items:center;gap:6px;padding-top:0;padding-bottom:0}
  .block.short .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .block.short .bt{margin:0;white-space:nowrap}
  .block .x{
    position:absolute;top:4px;inset-inline-end:4px;width:20px;height:20px;border-radius:50%;
    border:0;background:rgba(255,255,255,.75);color:#8A7D96;cursor:pointer;
    font-size:14px;line-height:20px;padding:0;opacity:0;transition:opacity .15s, background .15s;
  }
  .block.short .x{top:50%;transform:translateY(-50%)}
  .block:hover .x,.block:focus-within .x{opacity:1}
  .block .x:hover{background:#fff;color:var(--danger-ink)}
  @media (hover:none){.block .x{opacity:.85}}
  .block.dragging{opacity:.3}
  .ghost{
    position:fixed !important;left:0;top:0 !important;z-index:1000;pointer-events:none;
    box-shadow:0 12px 28px rgba(80,60,100,.25);opacity:.95;
  }
  .preview{
    position:absolute;inset-inline:4px;border-radius:10px;z-index:1;pointer-events:none;
    border:2px dashed #8FCFA8;background:rgba(158,216,180,.22);
  }
  .preview.bad{border-color:#E8A0AB;background:rgba(232,160,171,.2)}

  /* ---------- Empty state ---------- */
  .empty{grid-column:1/-1;display:grid;place-items:center;padding:24px}
  .empty .card{padding:40px 32px;text-align:center;max-width:420px}
  .dots{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
  .dots span{width:44px;border-radius:10px}
  .empty h2{margin:0 0 8px;font-size:22px}
  .empty p{color:var(--muted);margin:0 0 22px;line-height:1.6}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;z-index:2000;background:rgba(74,68,88,.28);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:16px;
    animation:fade .15s ease-out;
  }
  .modal{
    background:var(--panel);border-radius:22px;width:min(440px,100%);padding:24px;
    box-shadow:0 20px 50px rgba(74,68,88,.2);max-height:calc(100dvh - 32px);overflow:auto;
    animation:pop .18s ease-out;
  }
  @keyframes fade{from{opacity:0}}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
  .modal h3{margin:0 0 16px;font-size:19px}
  .modal p.msg{margin:0 0 20px;line-height:1.6;color:#6A6378}
  .field{display:block;margin-bottom:14px}
  .field > span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
  .input{
    width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line-strong);background:var(--bg);
    outline:none;transition:border-color .15s, box-shadow .15s;
  }
  .input:focus{border-color:var(--accent-strong);box-shadow:0 0 0 3px var(--accent-soft)}
  .row{display:flex;gap:10px}
  .row > *{flex:1;min-width:0}
  .dur{display:flex;gap:10px;align-items:center}
  .dur label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
  .dur .input{width:76px}
  .swatches{display:flex;flex-wrap:wrap;gap:8px}
  .sw input{position:absolute;opacity:0;pointer-events:none}
  .sw span{
    display:block;width:30px;height:30px;border-radius:50%;cursor:pointer;
    border:1px solid rgba(90,70,110,.12);transition:transform .1s;
  }
  .sw span:hover{transform:scale(1.08)}
  .sw input:checked + span{outline:2.5px solid var(--ink);outline-offset:2px}
  .sw input:focus-visible + span{outline:2.5px solid var(--accent-strong);outline-offset:2px}
  .err{color:var(--danger-ink);font-size:13px;min-height:18px;margin:0 0 8px}
  .modal.wide{width:min(560px,100%)}
  textarea.input{resize:vertical;min-height:130px;line-height:1.6;font-size:14px}
  .format-hint{font-size:12.5px;color:var(--muted);line-height:1.7;margin:-4px 0 12px}
  .format-hint code{background:var(--accent-soft);color:var(--accent-ink);padding:1px 6px;border-radius:6px;font-family:inherit;direction:rtl;unicode-bidi:isolate}
  .preview-list{list-style:none;margin:0 0 12px;padding:0;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px}
  .preview-list:empty{display:none}
  .preview-list li{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:13.5px;border-bottom:1px solid var(--line)}
  .preview-list li:last-child{border-bottom:0}
  .preview-list .chip{width:14px;height:14px;border-radius:4px;flex-shrink:0;border:1px solid rgba(90,70,110,.12)}
  .preview-list .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .preview-list .meta{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .preview-list li.bad{background:#FDF3F5}
  .preview-list li.bad .nm{color:var(--danger-ink);font-weight:400}
  .preview-list li.bad .meta{color:var(--danger-ink)}
  .summary{font-size:13px;color:var(--muted);margin:0 0 12px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .bank-actions{display:flex;gap:6px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opts label{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:12px;cursor:pointer;font-size:14px;transition:background .15s,border-color .15s}
  .opts label:has(input:checked){background:var(--accent-soft);border-color:var(--accent-strong)}
  .opts input{accent-color:var(--accent-strong);margin:0}
  .opts .sub{color:var(--muted);font-size:12.5px;margin-inline-start:auto}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .actions .spacer{flex:1}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);z-index:3000;
    background:#4A4458;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;max-width:calc(100% - 32px);text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- Mobile ---------- */
  @media (max-width:760px){
    .top{padding:10px 16px;gap:10px}
    .brand h1{font-size:17px}
    .trip-bar{width:100%}
    .trip-sel{flex:1;min-width:0;max-width:none}
    .range{width:100%;order:5;padding:0}
    #main{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:10px 16px 16px;gap:10px}
    .bank{max-height:34dvh}
    .bank-list{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
    .bank-list .block{width:calc(50% - 4px)}
    .hint{display:none}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B5BA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
    </div>
    <h1>מתכנן הטיולים</h1>
  </div>
  <div class="trip-bar" id="tripBar"></div>
</header>

<main id="main"></main>

<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';

  /* ================= Constants & state ================= */
  const KEY = 'tripPlanner.v1';
  const H = 28;            // pixel height of half an hour
  const SLOTS = 48;        // half-hours in a day
  const DAY = 864e5;
  const MAX_DAYS = 90;
  const COLORS = ['#FFD6E0','#FFE3C2','#FFF1B5','#D6F2C9','#C8EBE3','#CDE5FF','#DAD4FA','#F3D3F2','#FCD5C8','#E6E1DA'];

  const $ = (s, r = document) => r.querySelector(s);
  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let state = load();

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.trips)) return s;
    } catch (e) {}
    return { trips: [], currentId: null };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function cur() {
    return state.trips.find(t => t.id === state.currentId) || state.trips[0] || null;
  }

  /* ================= Date / time helpers ================= */
  function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }
  function fmtDate(ms) { return new Date(ms).toISOString().slice(0, 10); }
  function todayStr() { const n = new Date(); return fmtDate(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())); }
  function tripDays(t) {
    const out = [];
    for (let ms = parseDate(t.startDate); ms <= parseDate(t.endDate); ms += DAY) out.push(fmtDate(ms));
    return out;
  }
  function dayRange(t, day) {
    let a = 0, b = SLOTS;
    if (day === t.startDate) a = t.startSlot;
    if (day === t.endDate) b = t.endSlot;
    return [a, b];
  }
  function slotLabel(s) {
    const m = s * 30;
    return String(Math.floor(m / 60)).padStart(2, '0') + ':' + (m % 60 ? '30' : '00');
  }
  function weekday(d) { return new Date(parseDate(d)).toLocaleDateString('he-IL', { weekday: 'long', timeZone: 'UTC' }); }
  function shortDate(d) { const [y, m, dd] = d.split('-').map(Number); return dd + '.' + m; }
  function durLabel(min) {
    const h = Math.floor(min / 60), half = min % 60;
    if (h === 0) return 'חצי שעה';
    const base = h === 1 ? 'שעה' : h === 2 ? 'שעתיים' : h + ' שעות';
    return half ? base + ' וחצי' : base;
  }

  /* ================= Placement logic ================= */
  function canPlace(t, item, day, slot) {
    const len = item.duration / 30;
    const [a, b] = dayRange(t, day);
    if (slot < a || slot + len > b) return false;
    return !t.items.some(o => o.id !== item.id && o.day === day &&
      slot < o.slot + o.duration / 30 && o.slot < slot + len);
  }
  function toBank(t, item) {
    item.day = null; item.slot = null;
    t.items = t.items.filter(i => i !== item);
    t.items.push(item);
  }

  /* ================= Rendering ================= */
  const main = $('#main');
  const tripBar = $('#tripBar');

  function render() {
    const t = cur();
    if (t) state.currentId = t.id;
    renderTripBar(t);

    if (!t) {
      main.innerHTML = `
        <div class="empty"><div class="card">
          <div class="dots"><span style="height:34px;background:#FFD6E0"></span><span style="height:52px;background:#CDE5FF"></span><span style="height:24px;background:#D6F2C9"></span><span style="height:42px;background:#DAD4FA"></span></div>
          <h2>עדיין אין טיולים</h2>
          <p>יוצרים טיול, מוסיפים אטרקציות למאגר<br>וגוררים אותן אל לוח הזמנים.</p>
          <button class="btn primary" data-act="new-trip">+ יצירת טיול ראשון</button>
        </div></div>`;
      return;
    }

    const old = $('#gridScroll');
    const keep = old && old.dataset.trip === t.id ? { top: old.scrollTop, left: old.scrollLeft } : null;
    const bankItems = t.items.filter(i => !i.day);

    main.innerHTML = `
      <aside class="bank card" id="bank">
        <div class="bank-head">
          <h2>מאגר אטרקציות<span class="count">${bankItems.length ? '(' + bankItems.length + ')' : ''}</span></h2>
          <div class="bank-actions">
            <button class="btn small" data-act="import" title="הדבקת רשימת אטרקציות">ייבוא</button>
            <button class="btn primary small" data-act="add-item">+ הוספה</button>
          </div>
        </div>
        <div class="bank-list">
          ${bankItems.length ? bankItems.map(i => blockHTML(i, false)).join('') :
            `<div class="bank-empty">המאגר ריק.<br>אפשר להוסיף אטרקציות חדשות,<br>או לגרור לכאן קוביות מהלוח.</div>`}
        </div>
        <div class="hint">גוררים קובייה ללוח כדי לשבץ אותה, ובחזרה לכאן כדי להוציא אותה. לחיצה על קובייה פותחת עריכה.</div>
      </aside>
      <section class="board card">
        <div class="grid-scroll" id="gridScroll" data-trip="${t.id}">${gridHTML(t)}</div>
      </section>`;

    const gs = $('#gridScroll');
    if (keep) { gs.scrollTop = keep.top; gs.scrollLeft = keep.left; }
    else gs.scrollTop = Math.max(0, t.startSlot * H - H);
  }

  function renderTripBar(t) {
    if (!state.trips.length) {
      tripBar.innerHTML = `<button class="btn primary" data-act="new-trip">+ טיול חדש</button>`;
      return;
    }
    const days = tripDays(t).length;
    tripBar.innerHTML = `
      <select class="trip-sel" id="tripSel" aria-label="בחירת טיול">
        ${state.trips.map(x => `<option value="${x.id}" ${x.id === t.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
      </select>
      <span class="range">${shortDate(t.startDate)} ${slotLabel(t.startSlot)} עד ${shortDate(t.endDate)} ${slotLabel(t.endSlot)} · ${days === 1 ? 'יום אחד' : days + ' ימים'}</span>
      <button class="btn small" data-act="export">ייצוא</button>
      <button class="btn small" data-act="edit-trip">עריכה</button>
      <button class="btn small ghost" data-act="del-trip">מחיקה</button>
      <button class="btn primary small" data-act="new-trip">+ טיול חדש</button>`;
  }

  function blockHTML(item, placed) {
    const len = item.duration / 30;
    const style = placed
      ? `top:${item.slot * H + 1}px;height:${len * H - 3}px;`
      : `height:${len * H - 3}px;`;
    const sub = placed ? `${slotLabel(item.slot)}–${slotLabel(item.slot + len)}` : durLabel(item.duration);
    return `<div class="block ${len === 1 ? 'short' : ''}" data-id="${item.id}" style="${style}--c:${item.color}" title="${esc(item.name)}">
      <button class="x" data-act="del-item" aria-label="מחיקת אטרקציה">×</button>
      <div class="bn">${esc(item.name)}</div><div class="bt">${sub}</div>
    </div>`;
  }

  function gridHTML(t) {
    const days = tripDays(t);
    let h = `<div class="grid" style="grid-template-columns:64px repeat(${days.length},minmax(150px,1fr))">`;
    h += `<div class="corner"></div>`;
    days.forEach((d, i) => {
      h += `<div class="day-head"><div class="dn">${weekday(d)}</div><div class="dd">${shortDate(d)} · יום ${i + 1}</div></div>`;
    });
    h += `<div class="times">`;
    for (let s = 0; s < SLOTS; s++) h += `<div class="t">${s % 2 ? '' : slotLabel(s)}</div>`;
    h += `</div>`;
    days.forEach(d => {
      const [a, b] = dayRange(t, d);
      h += `<div class="day-col" data-day="${d}">`;
      for (let s = 0; s < SLOTS; s++) h += `<div class="slot${s % 2 ? ' odd' : ''}${s < a || s >= b ? ' off' : ''}"></div>`;
      t.items.filter(i => i.day === d).forEach(i => { h += blockHTML(i, true); });
      h += `</div>`;
    });

  /* ================= Import from pasted text ================= */
  // Returns minutes (unrounded) or null if the text isn't a recognizable duration.
  function parseDuration(raw) {
    let s = raw.trim().replace(/\s+/g, ' ').replace(',', '.');
    const words = { 'חצי שעה': 30, 'שעה': 60, 'שעה וחצי': 90, 'שעתיים': 120, 'שעתיים וחצי': 150 };
    if (words[s] != null) return words[s];
    let m;
    if ((m = s.match(/^(\d{1,2}):(\d{1,2})$/))) return +m[1] * 60 + +m[2];
    if ((m = s.match(/^(\d+(?:\.\d+)?)\s*(שעות|שעה|ש'|ש׳|h|hr|hrs|hours?)?$/i))) return Math.round(parseFloat(m[1]) * 60);
    if ((m = s.match(/^(\d+)\s*(דקות|דק'|דק׳|דק|min|mins|minutes?)$/i))) return +m[1];
    if ((m = s.match(/^(\d+)\s*(שעות|שעה)\s*ו\s*-?\s*(\d+)\s*(דקות|דק'|דק׳|דק)?$/))) return +m[1] * 60 + +m[3];
    if ((m = s.match(/^(\d+)\s*(שעות)?\s*וחצי$/))) return +m[1] * 60 + 30;
    return null;
  }

  function parseImport(text) {
    const entries = /\{[^}]*\}/.test(text)
      ? Array.from(text.matchAll(/\{([^}]*)\}/g), m => m[1])
      : text.split(/\r?\n/);

    return entries.map(e => e.trim()).filter(Boolean).map(raw => {
      let idx = raw.lastIndexOf(';');
      if (idx < 0) idx = raw.lastIndexOf('\t');
      if (idx < 0) return { ok: false, raw, reason: 'חסר ; בין השם לזמן' };
      const name = raw.slice(0, idx).trim().slice(0, 60);
      const durText = raw.slice(idx + 1).trim();
      if (!name) return { ok: false, raw, reason: 'חסר שם' };
      if (!durText) return { ok: false, raw, reason: 'חסר זמן' };
      const min = parseDuration(durText);
      if (min == null) return { ok: false, raw, reason: 'לא הבנתי את הזמן' };
      const dur = Math.round(min / 30) * 30;
      if (dur < 30) return { ok: false, raw, reason: 'קצר מחצי שעה' };
      if (dur > 1440) return { ok: false, raw, reason: 'ארוך מ-24 שעות' };
      return { ok: true, name, duration: dur, rounded: dur !== min };
    });
  }

  function openImportModal() {
    const t = cur();

        הזמן יכול להיות בשעות (<code>2</code>, <code>1.5</code>) או בשעות ודקות (<code>2:30</code>).
        אפשר גם להשתמש בפורמט <code>{שם;זמן},{שם;זמן}</code>, או להדביק שתי עמודות מאקסל.
      </p>
      <textarea class="input" id="impText" placeholder="מוזיאון הלובר; 3&#10;שייט על הסן; 1.5&#10;ארוחת ערב; 1:30"></textarea>

        : `<li class="bad"><span class="chip" style="background:#fff">✕</span><span class="nm">${esc(r.raw)}</span><span class="meta">${r.reason}</span></li>`

        t.colorIdx = (t.colorIdx || 0) + 1;
      });

      toast(good.length === 1 ? 'נוספה אטרקציה אחת למאגר' : `נוספו ${good.length} אטרקציות למאגר`);

  /* ================= Export (PNG / PDF) ================= */
  const FONT = "'Rubik', system-ui, 'Segoe UI', Arial, sans-serif";
  const PDF_DAYS_PER_PAGE = 7;

  function fittedRange(t) {
    const placed = t.items.filter(i => i.day);
    let from = 16, to = 44; // 08:00–22:00 by default
    placed.forEach(i => { from = Math.min(from, i.slot); to = Math.max(to, i.slot + i.duration / 30); });
    from = Math.floor(from / 2) * 2;
    to = Math.min(SLOTS, Math.ceil(to / 2) * 2);
    return [from, to];
  }

  function mixHex(a, b, p) {
    const h = x => [1, 3, 5].map(k => parseInt(x.slice(k, k + 2), 16));
    const A = h(a), B = h(b);
    return 'rgb(' + A.map((v, k) => Math.round(v * (1 - p) + B[k] * p)).join(',') + ')';
  }

  function rr(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function fitText(c, text, maxW) {
    if (c.measureText(text).width <= maxW) return text;
    let s = text;
    while (s.length > 1 && c.measureText(s + '…').width > maxW) s = s.slice(0, -1);
    return s + '…';
  }

  function wrapText(c, text, maxW, maxLines) {
    const words = text.split(/\s+/);
    const lines = [];
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (c.measureText(test).width <= maxW || !line) line = test;
      else { lines.push(line); line = w; }
    }
    if (line) lines.push(line);
    if (lines.length > maxLines) {
      const cut = lines.slice(0, maxLines);
      cut[maxLines - 1] = fitText(c, cut[maxLines - 1] + '…', maxW);
      return cut;
    }
    return lines.map(l => fitText(c, l, maxW));
  }

  async function loadFonts() {
    try {
      await Promise.all(['400 12px Rubik', '600 13px Rubik', '700 22px Rubik'].map(f => document.fonts.load(f, 'אבג')));
      await document.fonts.ready;
    } catch (e) {}
  }

  // dayList: [{date, index}] ; from/to: slot range to draw
  function drawSchedule(t, dayList, from, to, subtitle) {
    const pad = 28, titleH = 66, headH = 52, timeW = 60, colW = 160, rowH = 24;
    const n = dayList.length;
    const W = pad * 2 + timeW + n * colW;
    const gridH = (to - from) * rowH;
    const HH = pad * 2 + titleH + headH + gridH;
    const scale = (W * 2 > 16000 || HH * 2 > 16000) ? 1 : 2;

    const cv = document.createElement('canvas');
    cv.width = W * scale; cv.height = HH * scale;
    const c = cv.getContext('2d');
    c.scale(scale, scale);
    c.direction = 'rtl';

    // background + title
    c.fillStyle = '#FBF8F4'; c.fillRect(0, 0, W, HH);
    c.textAlign = 'right'; c.textBaseline = 'alphabetic';
    c.fillStyle = '#4A4458'; c.font = `700 22px ${FONT}`;
    c.fillText(fitText(c, t.name, W - pad * 2), W - pad, pad + 24);
    c.fillStyle = '#9A93A6'; c.font = `400 13px ${FONT}`;
    c.fillText(subtitle, W - pad, pad + 48);

    // card
    const gx = pad, gy = pad + titleH, gw = W - pad * 2, gh = headH + gridH;
    const right = gx + gw, top = gy + headH;
    const colX = i => right - timeW - (i + 1) * colW;
    c.save();
    rr(c, gx, gy, gw, gh, 16);
    c.fillStyle = '#FFFFFF'; c.fill();
    c.clip();

    // unavailable slots
    c.fillStyle = '#F5F2F6';
    dayList.forEach((d, i) => {
      const [a, b] = dayRange(t, d.date);
      for (let s = from; s < to; s++) if (s < a || s >= b) c.fillRect(colX(i), top + (s - from) * rowH, colW, rowH);
    });

    // horizontal lines
    c.lineWidth = 1;
    for (let s = from + 1; s < to; s++) {
      const full = s % 2 === 0, y = top + (s - from) * rowH + 0.5;
      c.strokeStyle = full ? '#E4DCE8' : '#F0EBF2';
      c.setLineDash(full ? [] : [3, 3]);
      c.beginPath(); c.moveTo(gx, y); c.lineTo(full ? right : right - timeW, y); c.stroke();
    }
    c.setLineDash([]);
    c.strokeStyle = '#E4DCE8';
    c.beginPath(); c.moveTo(gx, top + 0.5); c.lineTo(right, top + 0.5); c.stroke();

    // vertical lines
    c.strokeStyle = '#F0EBF2';
    for (let i = 0; i < n; i++) {
      const x = right - timeW - i * colW + 0.5;
      c.beginPath(); c.moveTo(x, gy); c.lineTo(x, gy + gh); c.stroke();
    }

    // day headers
    c.textAlign = 'center';
    dayList.forEach((d, i) => {
      const cx = colX(i) + colW / 2;
      c.fillStyle = '#4A4458'; c.font = `600 14px ${FONT}`;
      c.fillText(weekday(d.date), cx, gy + 23);
      c.fillStyle = '#9A93A6'; c.font = `400 12px ${FONT}`;
      c.fillText(`${shortDate(d.date)} · יום ${d.index + 1}`, cx, gy + 41);
    });

    // time labels
    c.fillStyle = '#9A93A6'; c.font = `400 11px ${FONT}`;
    for (let s = from; s < to; s++) if (s % 2 === 0) c.fillText(slotLabel(s), right - timeW / 2, top + (s - from) * rowH + 15);

    // blocks
    dayList.forEach((d, i) => {
      t.items.filter(it => it.day === d.date).forEach(it => {
        const len = it.duration / 30;
        const s0 = Math.max(it.slot, from), s1 = Math.min(it.slot + len, to);
        if (s1 <= s0) return;
        const x = colX(i) + 4, y = top + (s0 - from) * rowH + 1, w = colW - 8, h = (s1 - s0) * rowH - 3;
        c.save();
        rr(c, x, y, w, h, 8);
        c.fillStyle = it.color; c.fill();
        c.strokeStyle = mixHex(it.color, '#5A4A6A', 0.16); c.stroke();
        c.clip();
        const time = `${slotLabel(it.slot)}–${slotLabel(it.slot + len)}`;
        if (h < rowH * 1.5) {
          c.textBaseline = 'middle';
          c.textAlign = 'left'; c.font = `400 10.5px ${FONT}`; c.fillStyle = 'rgba(64,57,79,.7)';
          c.fillText(time, x + 6, y + h / 2 + 1);
          const tw = c.measureText(time).width;
          c.textAlign = 'right'; c.font = `600 12px ${FONT}`; c.fillStyle = '#40394F';
          c.fillText(fitText(c, it.name, w - 18 - tw), x + w - 8, y + h / 2 + 1);
        } else {
          c.textBaseline = 'top'; c.textAlign = 'right';
          c.font = `600 13px ${FONT}`; c.fillStyle = '#40394F';
          const maxLines = Math.max(1, Math.floor((h - 10 - 15) / 17));
          const lines = wrapText(c, it.name, w - 16, maxLines);
          lines.forEach((l, k) => c.fillText(l, x + w - 8, y + 6 + k * 17));
          const ty = y + 6 + lines.length * 17 + 1;
          if (ty + 13 <= y + h) {
            c.font = `400 11.5px ${FONT}`; c.fillStyle = 'rgba(64,57,79,.7)';
            c.fillText(time, x + w - 8, ty);
          }
        }
        c.restore();
      });
    });

    c.restore();
    c.strokeStyle = '#EDE6F0'; rr(c, gx + 0.5, gy + 0.5, gw - 1, gh - 1, 16); c.stroke();
    return cv;
  }

  function safeName(s) { return (s.replace(/[\\/:*?"<>|]/g, '').trim() || 'טיול'); }

  function downloadBlob(blob, filename) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  let jsPDFPromise = null;
  function loadJsPDF() {
    if (window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
    if (!jsPDFPromise) {
      jsPDFPromise = new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
        s.onload = () => window.jspdf ? res(window.jspdf.jsPDF) : rej();
        s.onerror = () => { jsPDFPromise = null; s.remove(); rej(); };
        document.head.appendChild(s);
      });
    }
    return jsPDFPromise;
  }

  function tripSubtitle(t) {
    return `${shortDate(t.startDate)} ${slotLabel(t.startSlot)} עד ${shortDate(t.endDate)} ${slotLabel(t.endSlot)}`;
  }

  async function exportPNG(t, from, to) {
    await loadFonts();
    const days = tripDays(t).map((date, index) => ({ date, index }));
    const cv = drawSchedule(t, days, from, to, tripSubtitle(t));
    await new Promise(res => cv.toBlob(b => { downloadBlob(b, safeName(t.name) + '.png'); res(); }, 'image/png'));
  }

  async function exportPDF(t, from, to) {
    const JsPDF = await loadJsPDF();
    await loadFonts();
    const days = tripDays(t).map((date, index) => ({ date, index }));
    const pages = [];
    for (let k = 0; k < days.length; k += PDF_DAYS_PER_PAGE) pages.push(days.slice(k, k + PDF_DAYS_PER_PAGE));
    let doc = null;
    pages.forEach((chunk, p) => {
      const sub = tripSubtitle(t) + (pages.length > 1 ? ` · עמוד ${p + 1} מתוך ${pages.length}` : '');
      const cv = drawSchedule(t, chunk, from, to, sub);
      const orient = cv.width >= cv.height ? 'landscape' : 'portrait';
      if (!doc) doc = new JsPDF({ orientation: orient, unit: 'mm', format: 'a4' });
      else doc.addPage('a4', orient);
      const pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight(), m = 8;
      const r = Math.min((pw - 2 * m) / cv.width, (ph - 2 * m) / cv.height);
      const w = cv.width * r, h = cv.height * r;
      doc.addImage(cv.toDataURL('image/png'), 'PNG', (pw - w) / 2, m, w, h);
    });
    doc.save(safeName(t.name) + '.pdf');
  }

  function openExportModal() {
    const t = cur();
    const [ff, ft] = fittedRange(t);
    openModal(`
      <h3>ייצוא לוח הזמנים</h3>
      <div class="field"><span>אילו שעות להציג?</span>
        <div class="opts">
          <label><input type="radio" name="range" value="fit" checked> השעות הרלוונטיות <span class="sub">${slotLabel(ff)}–${slotLabel(ft)}</span></label>
          <label><input type="radio" name="range" value="full"> כל היממה <span class="sub">00:00–24:00</span></label>
        </div>
      </div>
      <p class="format-hint">בקובץ PDF כל עמוד מציג עד ${PDF_DAYS_PER_PAGE} ימים.</p>
      <div class="actions">
        <button class="btn primary" id="exPng">הורדה כתמונה</button>
        <button class="btn primary" id="exPdf">הורדה כ-PDF</button>
        <button class="btn ghost" id="cancel">ביטול</button>
      </div>`);

    $('#cancel').onclick = closeModal;
    const run = async (btn, fn) => {
      const full = modal.querySelector('input[name="range"]:checked').value === 'full';
      const [from, to] = full ? [0, SLOTS] : [ff, ft];
      const label = btn.textContent;
      modal.querySelectorAll('button').forEach(b => b.disabled = true);
      btn.textContent = 'מכין את הקובץ…';
      try {
        await fn(t, from, to);
        closeModal();
        toast('הקובץ ירד למחשב');
      } catch (e) {
        modal.querySelectorAll('button').forEach(b => b.disabled = false);
        btn.textContent = label;
        toast(fn === exportPDF ? 'לא הצלחתי ליצור PDF. כדי לייצא PDF צריך חיבור לאינטרנט' : 'משהו השתבש בייצוא');
      }
    };
    $('#exPng').onclick = e => run(e.currentTarget, exportPNG);
    $('#exPdf').onclick = e => run(e.currentTarget, exportPDF);
  }

  function openTripModal(edit) {
    const t = edit ? cur() : null;
    const today = todayStr();
    const v = t || {
      name: '', startDate: today, startSlot: 20,
      endDate: fmtDate(parseDate(today) + 3 * DAY), endSlot: 40
    };
    const opts = (from, to, sel) => {
      let o = '';
      for (let s = from; s <= to; s++) o += `<option value="${s}" ${s === sel ? 'selected' : ''}>${slotLabel(s)}</option>`;
      return o;
    };

    openModal(`
      <form id="tripForm" novalidate>
        <h3>${t ? 'עריכת טיול' : 'טיול חדש'}</h3>
        <label class="field"><span>שם הטיול</span>
          <input class="input" name="name" maxlength="50" autocomplete="off" placeholder="למשל: רומא 2027" value="${esc(v.name)}">
        </label>
        <div class="field"><span>מתי הטיול מתחיל?</span>
          <div class="row">
            <input class="input" type="date" name="sd" value="${v.startDate}">
            <select class="input" name="ss">${opts(0, 47, v.startSlot)}</select>
          </div>
        </div>
        <div class="field"><span>מתי הטיול נגמר?</span>
          <div class="row">
            <input class="input" type="date" name="ed" value="${v.endDate}">
            <select class="input" name="es">${opts(1, 48, v.endSlot)}</select>
          </div>
        </div>
        <p class="err" id="err"></p>
        <div class="actions">
          <button class="btn primary" type="submit">${t ? 'שמירה' : 'יצירת הטיול'}</button>
          <button class="btn ghost" type="button" id="cancel">ביטול</button>
        </div>
      </form>`);

    const f = $('#tripForm');
    f.elements.name.focus();
    $('#cancel').onclick = closeModal;

    f.onsubmit = e => {
      e.preventDefault();
      const err = $('#err');
      const name = f.elements.name.value.trim() || 'הטיול שלי';
      const sd = f.sd.value, ed = f.ed.value;
      const ss = parseInt(f.ss.value, 10), es = parseInt(f.es.value, 10);
      if (!sd || !ed) { err.textContent = 'צריך לבחור תאריך התחלה ותאריך סיום'; return; }
      const startAbs = parseDate(sd) / DAY * SLOTS + ss;
      const endAbs = parseDate(ed) / DAY * SLOTS + es;
      if (endAbs <= startAbs) { err.textContent = 'סוף הטיול צריך להיות אחרי ההתחלה'; return; }
      if ((parseDate(ed) - parseDate(sd)) / DAY + 1 > MAX_DAYS) { err.textContent = `אפשר לתכנן עד ${MAX_DAYS} ימים`; return; }

      if (t) {
        Object.assign(t, { name, startDate: sd, startSlot: ss, endDate: ed, endSlot: es });
        const days = new Set(tripDays(t));
        let moved = 0;
        t.items.filter(i => i.day).forEach(i => {
          if (!days.has(i.day) || !canPlace(t, i, i.day, i.slot)) { toBank(t, i); moved++; }
        });
        if (moved) toast(moved === 1 ? 'אטרקציה אחת יצאה מטווח הטיול וחזרה למאגר' : `${moved} אטרקציות יצאו מטווח הטיול וחזרו למאגר`);
      } else {
        const nt = { id: uid(), name, startDate: sd, startSlot: ss, endDate: ed, endSlot: es, items: [], colorIdx: 0 };
        state.trips.push(nt);
        state.currentId = nt.id;
      }
      save(); closeModal(); render();
    };
  }

  /* ================= Actions (event delegation) ================= */
  document.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    const t = cur();
    if (act === 'new-trip') openTripModal(false);
    else if (act === 'edit-trip') openTripModal(true);
    else if (act === 'del-trip') {
      confirmDialog('מחיקת טיול', `בטוח שרוצים למחוק את הטיול "${esc(t.name)}" וכל מה שתוכנן בו?`, 'כן, למחוק', () => {
        state.trips = state.trips.filter(x => x !== t);
        state.currentId = state.trips[0] ? state.trips[0].id : null;
        save(); render();
      });
    }
    else if (act === 'add-item') openItemModal(null);
    else if (act === 'import') openImportModal();
    else if (act === 'export') openExportModal();
    else if (act === 'del-item') {
      const item = t.items.find(i => i.id === btn.closest('.block').dataset.id);
      if (!item) return;
      confirmDialog('מחיקת אטרקציה', `בטוח שרוצים למחוק את "${esc(item.name)}"?`, 'כן, למחוק', () => {
        t.items = t.items.filter(i => i !== item);
        save(); render();
      });
    }
  });

  tripBar.addEventListener('change', e => {
    if (e.target.id === 'tripSel') { state.currentId = e.target.value; save(); render(); }
  });

  /* ================= Drag & drop (mouse + touch) ================= */
  let drag = null;

  main.addEventListener('pointerdown', e => {
    const el = e.target.closest('.block');
    if (!el || e.target.closest('.x')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const r = el.getBoundingClientRect();
    drag = {
      id: el.dataset.id, el,
      sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY,
      offX: e.clientX - r.left, offY: e.clientY - r.top, w: r.width, h: r.height,
      started: false, target: null, ghost: null, preview: null
    };
    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  });

  function detach() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
  }

  function onMove(e) {
    if (!drag) return;
    drag.x = e.clientX; drag.y = e.clientY;
    if (!drag.started) {
      if (Math.hypot(drag.x - drag.sx, drag.y - drag.sy) < 6) return;
      beginDrag();
    }
    e.preventDefault();
    moveGhost();
    updateTarget();
  }

  function beginDrag() {
    drag.started = true;
    drag.item = cur().items.find(i => i.id === drag.id);
    const g = drag.el.cloneNode(true);
    g.classList.add('ghost');
    g.style.width = drag.w + 'px';
    g.style.height = drag.h + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    drag.el.classList.add('dragging');
    document.body.classList.add('is-dragging');
    moveGhost();
    requestAnimationFrame(autoScroll);
  }

  function moveGhost() {
    drag.ghost.style.transform = `translate(${drag.x - drag.offX}px, ${drag.y - drag.offY}px)`;
  }

  function setBankHover(on) { const b = $('#bank'); if (b) b.classList.toggle('drop-hover', on); }
  function removePreview() { if (drag.preview) { drag.preview.remove(); drag.preview = null; } }

  function updateTarget() {
    const under = document.elementFromPoint(drag.x, drag.y);
    const col = under && under.closest('.day-col');
    const bank = under && under.closest('.bank');
    const t = cur(), item = drag.item, len = item.duration / 30;

    if (col) {
      setBankHover(false);
      const rect = col.getBoundingClientRect();
      let slot = Math.round((drag.y - drag.offY - rect.top) / H);
      slot = Math.max(0, Math.min(SLOTS - len, slot));
      const day = col.dataset.day;
      const ok = canPlace(t, item, day, slot);
      if (!drag.preview || drag.preview.parentNode !== col) {
        removePreview();
        drag.preview = document.createElement('div');
        drag.preview.className = 'preview';
        col.appendChild(drag.preview);
      }
      drag.preview.style.top = (slot * H + 1) + 'px';
      drag.preview.style.height = (len * H - 3) + 'px';
      drag.preview.classList.toggle('bad', !ok);
      drag.target = { type: 'grid', day, slot, ok };
    } else if (bank) {
      removePreview();
      setBankHover(true);
      drag.target = { type: 'bank' };
    } else {
      removePreview();
      setBankHover(false);
      drag.target = null;
    }
  }

  function autoScroll() {
    if (!drag || !drag.started) return;
    const gs = $('#gridScroll');
    if (gs) {
      const r = gs.getBoundingClientRect();
      const E = 50, SP = 12;
      let dx = 0, dy = 0;
      const inX = drag.x > r.left - 20 && drag.x < r.right + 20;
      const inY = drag.y > r.top - 20 && drag.y < r.bottom + 20;
      if (inX) {
        if (drag.y < r.top + E + 56 && drag.y > r.top - 20) dy = -SP;
        else if (drag.y > r.bottom - E && drag.y < r.bottom + 20) dy = SP;
      }
      if (inY) {
        if (drag.x < r.left + E && drag.x > r.left - 20) dx = -SP;
        else if (drag.x > r.right - E && drag.x < r.right + 20) dx = SP;
      }
      if (dx || dy) {
        const bt = gs.scrollTop, bl = gs.scrollLeft;
        gs.scrollBy(dx, dy);
        if (gs.scrollTop !== bt || gs.scrollLeft !== bl) updateTarget();
      }
    }
    requestAnimationFrame(autoScroll);
  }

  function endDragVisuals(d) {
    if (d.ghost) d.ghost.remove();
    if (d.preview) d.preview.remove();
    if (d.el) d.el.classList.remove('dragging');
    document.body.classList.remove('is-dragging');
    setBankHover(false);
  }

  function onUp() {
    const d = drag;
    detach();
    drag = null;
    if (!d) return;
    if (!d.started) { openItemModal(d.id); return; }

    endDragVisuals(d);
    const t = cur(), item = d.item, tg = d.target;
    if (tg && tg.type === 'grid') {
      if (tg.ok) { item.day = tg.day; item.slot = tg.slot; }
      else toast('אין מקום פנוי שם, האטרקציה נשארה במקומה');
    } else if (tg && tg.type === 'bank') {
      if (item.day) toBank(t, item);
    }
    save(); render();
  }

  function onCancel() {
    const d = drag;
    detach();
    drag = null;
    if (d && d.started) { endDragVisuals(d); render(); }
  }

  render();
})();
</script>
</body>
</html>
